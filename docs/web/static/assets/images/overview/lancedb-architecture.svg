<svg xmlns="http://www.w3.org/2000/svg" width="800" height="676" viewBox="0 0 800 676" role="img" aria-labelledby="title desc">
  <title id="title">LanceDB Embedded and Enterprise architecture</title>
  <desc id="desc">LanceDB Embedded runs the application and embedded library in one process with local disk or object storage. Enterprise separates query serving, read execution and caching, and indexing and background workers. The control plane governs the service. Enterprise persists tables in object storage. Both offerings use the Lance format, without automatically sharing storage.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 7 4 1 7" fill="none" stroke="#596776" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .title { font-size: 27px; font-weight: 650; }
      .label { font-size: 23px; font-weight: 550; }
      .small { font-size: 21px; font-weight: 550; }
      .note { font-size: 20px; fill: #475569; }
      .flow { fill: none; stroke: #596776; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="800" height="676" rx="20" fill="#ffffff"/>

  <rect x="12" y="12" width="380" height="580" rx="16" fill="#f3f6f9" stroke="#d4dce6"/>
  <text class="title" x="36" y="53">LanceDB Embedded</text>
  <text class="note" x="36" y="83">Embedded library</text>
  <rect x="36" y="110" width="332" height="296" rx="10" fill="#ffffff" stroke="#c4cfdd"/>
  <text class="label" x="202" y="164" text-anchor="middle">Application +</text>
  <text class="label" x="202" y="196" text-anchor="middle">LanceDB library</text>
  <text class="note" x="202" y="262" text-anchor="middle">Queries</text>
  <text class="note" x="202" y="293" text-anchor="middle">Indexing</text>
  <text class="note" x="202" y="324" text-anchor="middle">Maintenance</text>
  <path class="flow" d="M202 406 V441"/>
  <rect x="36" y="444" width="332" height="50" rx="10" fill="#e5ecf3"/>
  <text class="label" x="202" y="476" text-anchor="middle">Local disk or object storage</text>

  <rect x="408" y="12" width="380" height="580" rx="16" fill="#fff5ed" stroke="#efc5a4"/>
  <text class="title" x="432" y="53">LanceDB Enterprise</text>
  <text class="note" x="432" y="79">Distributed multimodal</text>
  <text class="note" x="432" y="102">lakehouse</text>
  <rect x="432" y="110" width="332" height="74" rx="10" fill="#ffffff" stroke="#e9c8b0"/>
  <text class="label" x="598" y="140" text-anchor="middle">Applications +</text>
  <text class="label" x="598" y="168" text-anchor="middle">LanceDB SDK</text>
  <path class="flow" d="M598 184 V219"/>
  <rect x="432" y="222" width="332" height="50" rx="10" fill="#ffdfc5"/>
  <text class="label" x="598" y="254" text-anchor="middle">Query serving</text>
  <path class="flow" d="M598 272 V288 H510 V304"/>
  <path class="flow" d="M598 288 H686 V304"/>
  <rect x="432" y="308" width="156" height="98" rx="10" fill="#ffffff" stroke="#e9c8b0"/>
  <text class="small" x="510" y="337" text-anchor="middle">Read</text>
  <text class="small" x="510" y="363" text-anchor="middle">execution</text>
  <text class="small" x="510" y="389" text-anchor="middle">+ caching</text>
  <rect x="608" y="308" width="156" height="98" rx="10" fill="#ffffff" stroke="#e9c8b0"/>
  <text class="small" x="686" y="337" text-anchor="middle">Indexing +</text>
  <text class="small" x="686" y="363" text-anchor="middle">background</text>
  <text class="small" x="686" y="389" text-anchor="middle">work</text>
  <path class="flow" d="M510 406 V441"/>
  <path class="flow" d="M686 406 V441"/>
  <rect x="432" y="444" width="332" height="50" rx="10" fill="#ffdfc5"/>
  <text class="label" x="598" y="476" text-anchor="middle">Durable object storage</text>
  <rect x="432" y="510" width="332" height="62" rx="10" fill="#ffffff" stroke="#e9c8b0" stroke-dasharray="5 4"/>
  <text class="small" x="598" y="537" text-anchor="middle">Control plane</text>
  <text class="note" x="598" y="560" text-anchor="middle">Manages the service</text>

  <rect x="12" y="610" width="776" height="54" rx="16" fill="#edf5f1" stroke="#c3dacf"/>
  <text class="label" x="400" y="644" text-anchor="middle">Shared foundation: Lance format</text>
</svg>
