[default]
extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",
    # Conventional import aliases in the docs examples: `import fiftyone as fo`
    # and `import torchvision.io as tio`.
    "\\bas (fo|tio)\\b",
    "\\btio\\.",
    # The substring query in the n-gram full-text search example.
    'search\("nce"',
    # Garbled OCR output quoted verbatim in the VLM fine-tuning tutorial.
    "permission nstallation",
]

[default.extend-words]
# Azure Kubernetes Service, mentioned in rust/lancedb/src/remote/oauth.rs.
AKS = "AKS"
# RabitQ is the name of a vector quantization algorithm, not a typo of "Rabbit".
Rabit = "Rabit"
# `VarBuilder::from_mmaped_safetensors` is the real (if oddly-spelled) name of
# the candle-core API we call in rust/lancedb/src/embeddings/sentence_transformers.rs.
mmaped = "mmaped"
# `WriteableBuffer` is the real name of a type from Python's `_typeshed` stubs,
# used in python/python/lancedb/_blob.py.
Writeable = "Writeable"
# Superlinked's self-hosted inference engine (SIE), its `sie-lancedb` package,
# and the `sie` embedding function it registers, in
# docs/web/integrations/embedding/superlinked.mdx.
SIE = "SIE"

[files]
extend-exclude = [
    "*_THIRD_PARTY_LICENSES.*",
]
