[package]
name = "lance-linalg"
version = "15.0.0-beta.13"
publish = false
edition = { workspace = true }
license = { workspace = true }
repository = "https://github.com/lance-format/lance"
description = "Arrow native linear algebra algorithms for Lance"
readme = "README.md"
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
argminmax = "0.7.1"
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
half = { workspace = true }
lance-arrow = { workspace = true }
lance-core = { workspace = true }
num-traits = { workspace = true }
rayon = "1.10"

[dev-dependencies]
approx = "0.5.1"
arrow-buffer = { workspace = true }
criterion = { version = "0.8.2", features = ["async", "async_tokio", "html_reports"] }
lance-testing = { workspace = true }
proptest = "1.3.1"
rand = { workspace = true }
rstest = "0.26.1"

[build-dependencies]
cc = "1.0.83"

[features]
# Enable compiling multiple C kernels for fp16 SIMD computations.
# This requires GCC 12 / Clang 6 or later. (To get AVX-512 support,
# you need Clang 11 or later.)
fp16kernels = []

[[bench]]
name = "l2"
harness = false

[[bench]]
name = "dot"
harness = false

[[bench]]
name = "argmin"
harness = false

[[bench]]
name = "cosine"
harness = false

[[bench]]
name = "norm_l2"
harness = false

[[bench]]
name = "dist_table"
harness = false

[[bench]]
name = "batch_distance"
harness = false

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage,coverage_nightly)"] }
