name: Build and publish Java packages
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without publishing to Maven Central
        type: boolean
        default: true
        required: true
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/java-publish.yml

permissions:
  contents: read

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./java
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: "maven"
          server-id: ossrh
          server-username: SONATYPE_USER
          server-password: SONATYPE_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set git config
        run: |
          git config --global user.email "dev+gha@lancedb.com"
          git config --global user.name "LanceDB Github Runner"
      - name: Validate package version
        run: |
          python - <<'PYTHON'
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = tomllib.loads(Path("../.bumpversion.toml").read_text())["tool"]["bumpversion"]["current_version"]
          actual = ET.parse("pom.xml").findtext("{http://maven.apache.org/POM/4.0.0}version")
          if actual != expected:
              raise ValueError(f"Maven version {actual} differs from release version {expected}")
          print(f"Validated Maven version {actual}")
          PYTHON
      - name: Dry run
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          ./mvnw --batch-mode -DskipTests package -pl lancedb-core -am
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: |
          echo "use-agent" >> ~/.gnupg/gpg.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          export GPG_TTY=$(tty)
          ./mvnw --batch-mode -DskipTests -DpushChanges=false deploy -pl lancedb-core -am -P deploy-to-ossrh
        env:
          SONATYPE_USER: ${{ secrets.SONATYPE_USER }}
          SONATYPE_TOKEN: ${{ secrets.SONATYPE_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  report-failure:
    name: Report Workflow Failure
    runs-on: ubuntu-latest
    needs: [publish]
    if: always() && failure() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/create-failure-issue
        with:
          job-results: ${{ toJSON(needs) }}
          workflow-name: ${{ github.workflow }}
