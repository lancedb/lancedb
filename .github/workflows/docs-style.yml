name: Docs prose style

# Style findings are advisory; installation and configuration errors fail.
on:
  pull_request:
    paths:
      - "docs/web/**/*.mdx"
      - ".vale.ini"
      - ".github/vale/**"
      - ".github/workflows/docs-style.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  prose:
    name: Lint changed prose
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Annotate changed lines
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: '3.24.0'
          sync: false
          files: docs/web
          reporter: github-pr-annotations
          filter_mode: added
          fail_on_error: false
