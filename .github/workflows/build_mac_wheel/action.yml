# We create a composite action to be re-used both for testing and for releasing
name: build_wheel
description: "Build a lance wheel"
inputs:
  python-minor-version:
    description: "Python minor version for the requested interpreter (e.g. 10, 13, 15)"
    required: true
  args:
    description: "--release"
    required: false
    default: ""
  maturin-version:
    description: "Version of maturin to use for this wheel build"
    required: false
    default: "1.12.4"
runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-protoc
    - name: Build wheel
      uses: PyO3/maturin-action@v1
      with:
        command: build
        maturin-version: ${{ inputs.maturin-version }}
        # TODO: pass through interpreter
        args: ${{ inputs.args }}
        docker-options: "-e PIP_EXTRA_INDEX_URL='https://pypi.fury.io/lance-format/ https://pypi.fury.io/lancedb/'"
        working-directory: python
