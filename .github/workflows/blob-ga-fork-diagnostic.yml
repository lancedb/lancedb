name: Held remote fork diagnostic

# One experiment branch only. Ordinary Python CI and its matrix remain unchanged.
on:
  push:
    branches: [xuanwo/blob-ga-hosted-fork-diagnostic-20261112]
    paths:
      - .github/workflows/blob-ga-fork-diagnostic.yml
      - ci/blob_ga_fork/**

permissions:
  contents: read
  actions: read

jobs:
  experiment:
    name: Full Python 3.10 suite without fork instrumentation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTEST_ADDOPTS: "--color=yes"
      FORCE_COLOR: "1"
      PIP_EXTRA_INDEX_URL: "https://pypi.fury.io/lance-format/ https://pypi.fury.io/lancedb/"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the pushed candidate, never GitHub's synthetic PR merge tree.
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
      - name: Verify exact feature product source
        run: python3 ci/blob_ga_fork/capture_source.py "$RUNNER_TEMP/fork-evidence"
      - name: Install protobuf
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10.22"
      - name: Download exact retained inputs (no rebuild or cache)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/retained-inputs" "$RUNNER_TEMP/fork-evidence/reference"
          gh api "repos/$GH_REPO/actions/runs/43275262488" > "$RUNNER_TEMP/fork-evidence/retained-run.json"
          jq -e '.head_sha == "4cc56d4fcb2205c17f87142a6eca1d2ccba13bd8" and .status == "completed"' "$RUNNER_TEMP/fork-evidence/retained-run.json"
          gh api "repos/$GH_REPO/actions/runs/43275262488/artifacts" > "$RUNNER_TEMP/fork-evidence/retained-artifacts.json"
          gh api "repos/$GH_REPO/actions/artifacts/13972680483/zip" > "$RUNNER_TEMP/retained-inputs/evidence.zip"
          gh api "repos/$GH_REPO/actions/artifacts/13971742890/zip" > "$RUNNER_TEMP/retained-inputs/wheel.zip"
          cd "$RUNNER_TEMP/retained-inputs"
          echo "b2d6288874970dee35613187ddc0f4b04f89660f4e9418525683887a2e96ced8  evidence.zip" | sha256sum -c -
          echo "41b57da8ffdea64134081f00ae619646040503d528cf90e620a2e8ea3f89d6f1  wheel.zip" | sha256sum -c -
          unzip -q evidence.zip -d "$RUNNER_TEMP/fork-evidence/reference"
          mkdir -p "$GITHUB_WORKSPACE/target/wheels"
          unzip -q wheel.zip -d "$GITHUB_WORKSPACE/target/wheels"
          cd "$GITHUB_WORKSPACE"
          echo "0bd08768570c43107c9e158f608f56f7926d0e62345eafd531bb4b12be9e2c3b  target/wheels/lancedb-0.42.0b12-cp310-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" | sha256sum -c -
      - name: Install recorded package versions and retained wheel
        run: |
          python ci/blob_ga_fork/capture_identity.py --requirements \
            "$RUNNER_TEMP/fork-evidence/reference/loaded-identity.json" \
            "$RUNNER_TEMP/fork-evidence/requirements.txt"
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/install-packages" \
            python -m pip install --no-cache-dir --only-binary=:all: --no-deps --force-reinstall \
            -r "$RUNNER_TEMP/fork-evidence/requirements.txt"
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/install-wheel" \
            python -m pip install --no-cache-dir --no-deps \
            "$(ls target/wheels/lancedb-*.whl)[tests,dev]"
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/pip-check" \
            python -m pip check
      - name: Verify installed identities against retained experiment
        run: |
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/identity-before" \
            python ci/blob_ga_fork/capture_identity.py \
            "$RUNNER_TEMP/fork-evidence/loaded-identity-before.json" target/wheels/lancedb-*.whl \
            "$RUNNER_TEMP/fork-evidence/reference/loaded-identity.json"
      - name: Set up original localstack integration fixture
        run: |
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/localstack" \
            docker compose up --detach --wait
      - name: Capture host and fixture identity outside pytest
        if: always()
        run: |
          {
            printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
            uname -a
            cat /etc/os-release
            lscpu
          } > "$RUNNER_TEMP/fork-evidence/host.txt"
          dpkg-query -W > "$RUNNER_TEMP/fork-evidence/host-packages.txt"
          docker image ls --digests --no-trunc > "$RUNNER_TEMP/fork-evidence/docker-images.txt"
          docker image inspect localstack/localstack:4.0 > "$RUNNER_TEMP/fork-evidence/localstack-image.json"
          docker compose ps --format json > "$RUNNER_TEMP/fork-evidence/localstack-containers.json"
      - name: Run original complete suite in original order without probe
        run: |
          # The logger is a separate parent process; pytest gets only original arguments.
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/pytest" \
            pytest -m "not slow" -vv --durations=30 python/python/tests
      - name: Verify identities after suite (also after failure)
        if: always()
        run: |
          python ci/blob_ga_fork/log_command.py "$RUNNER_TEMP/fork-evidence/identity-after" \
            python ci/blob_ga_fork/capture_identity.py \
            "$RUNNER_TEMP/fork-evidence/loaded-identity-after.json" target/wheels/lancedb-*.whl \
            "$RUNNER_TEMP/fork-evidence/reference/loaded-identity.json"
      - name: Verify source after suite (also after failure)
        if: always()
        run: python3 ci/blob_ga_fork/capture_source.py "$RUNNER_TEMP/fork-evidence/source-after"
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fork-uninstrumented-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/fork-evidence/
          if-no-files-found: error
          retention-days: 30

  archive-job-log:
    name: Archive completed experiment job log
    needs: experiment
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Download completed job log once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/job-log"
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" > "$RUNNER_TEMP/job-log/jobs.json"
          job_id=$(jq -r '.jobs[] | select(.name == "Full Python 3.10 suite without fork instrumentation") | .id' "$RUNNER_TEMP/job-log/jobs.json")
          set +e
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GH_REPO/actions/jobs/$job_id/logs" > "$RUNNER_TEMP/job-log/experiment.log" 2> "$RUNNER_TEMP/job-log/download.stderr"
          result=$?
          set -e
          echo "$result" > "$RUNNER_TEMP/job-log/download.exit"
          exit "$result"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fork-uninstrumented-completed-job-log-${{ github.run_id }}
          path: ${{ runner.temp }}/job-log/
          if-no-files-found: error
          retention-days: 30
