name: Cargo Publish

on:
  push:
    tags-ignore:
      # We don't publish pre-releases for Rust. Crates.io is just a source
      # distribution, so we don't need to publish pre-releases.
      - "v*-beta*"

env:
  # This env var is used by Swatinem/rust-cache@v2 for the cache
  # key, so we set it to make sure it is always consistent.
  CARGO_TERM_COLOR: always
  # Up-to-date compilers needed for fp16kernels.
  CC: gcc-12
  CXX: g++-12

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
    timeout-minutes: 30
    # Only runs on tags that matches the make-release action
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler libssl-dev
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the packages
        run: |
          set -euo pipefail
          fixture_version="${GITHUB_REF_NAME#v}"
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent 'lancedb-release (https://github.com/lancedb/lancedb)' \
            "https://crates.io/api/v1/crates/lancedb-test-fixtures/${fixture_version}")
          case "$status" in
            200) echo "lancedb-test-fixtures ${fixture_version} is already published" ;;
            404) cargo publish -p lancedb-test-fixtures --token ${{ steps.auth.outputs.token }} ;;
            *) echo "::error::Cannot check fixture publication (HTTP ${status})"; exit 1 ;;
          esac
          cargo publish -p lancedb --all-features --token ${{ steps.auth.outputs.token }}
  report-failure:
    name: Report Workflow Failure
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && failure() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/create-failure-issue
        with:
          job-results: ${{ toJSON(needs) }}
          workflow-name: ${{ github.workflow }}
